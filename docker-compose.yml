# PostgreSQL only. The API and the web app run natively (`npm run` in apps/*);
# wrapping the edit-reload loop in containers would add latency without protecting
# anything. See docs/ARCHITECTURE.md §7.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: myfittrack
      POSTGRES_PASSWORD: myfittrack
      POSTGRES_DB: myfittrack
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myfittrack -d myfittrack']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
