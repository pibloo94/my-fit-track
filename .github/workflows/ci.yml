name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: myfittrack
          POSTGRES_PASSWORD: myfittrack
          POSTGRES_DB: myfittrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfittrack -d myfittrack"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://myfittrack:myfittrack@localhost:5432/myfittrack?schema=public
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Integration tests
        run: npm run test:integration

      - name: Apply migrations
        run: npm run db:migrate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload web bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/browser
          retention-days: 1

  image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t my-fit-track-api:${{ github.sha }} --build-arg APP_VERSION=${{ github.sha }} .

  staging:
    name: Deploy staging
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check staging secrets
        id: secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$STAGING_API_BASE_URL" ]; then
            echo "Staging secrets are not set. Skipping deploy. See README."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.secrets.outputs.skip == 'false'
        uses: actions/checkout@v5

      - name: Download web bundle
        if: steps.secrets.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/browser

      - name: Point the web app at the staging API
        if: steps.secrets.outputs.skip == 'false'
        env:
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          node -e "const fs=require('node:fs'); const url=process.env.STAGING_API_BASE_URL; if(!url) throw new Error('STAGING_API_BASE_URL is empty'); fs.writeFileSync('apps/web/dist/browser/app-config.json', JSON.stringify({apiBaseUrl: url.replace(/\/$/, '')})+'\n')"

      - name: Deploy web to Cloudflare Pages
        if: steps.secrets.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/web/dist/browser --project-name my-fit-track-staging --commit-dirty=true

      - name: Deploy API to Railway
        if: steps.secrets.outputs.skip == 'false'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: npx --yes @railway/cli up --ci --service "${RAILWAY_SERVICE:-api}"
